<main id="main-content" class="flex min-h-dvh items-center justify-center px-4 py-12">
  <div hlmCard class="w-full max-w-sm">
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-xl font-semibold">{{ heading() }}</h1>
      @if (description()) {
        <p hlmCardDescription>{{ description() }}</p>
      }
    </div>

    <div hlmCardContent class="grid gap-4">
      <ng-content />
    </div>

    <div hlmCardFooter class="justify-center text-sm text-muted-foreground">
      <ng-content select="[authShellFooter]" />
    </div>
  </div>
</main>
