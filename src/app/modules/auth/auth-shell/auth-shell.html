<main id="main-content" class="flex min-h-dvh items-center justify-center px-4 py-12">
  <div hlmCard class="w-full max-w-sm">
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-xl font-semibold">{{ heading() }}</h1>
      @if (description()) {
        <p hlmCardDescription>{{ description() }}</p>
      }
    </div>

    <div hlmCardContent class="grid gap-4">
      <!--
        The API has no Google provider configured yet, so this stays disabled. Full opacity
        and a dashed border keep "Soon" readable, where the usual faded look would not.
      -->
      <button
        hlmBtn
        variant="outline"
        type="button"
        class="w-full border-dashed text-muted-foreground data-disabled:opacity-100"
        disabled
      >
        Continue with Google
        <span hlmBadge variant="secondary" aria-hidden="true">Soon</span>
        <span class="sr-only">(coming soon)</span>
      </button>

      <div class="flex items-center gap-3 text-xs text-muted-foreground">
        <span class="h-px flex-1 bg-border"></span>
        or
        <span class="h-px flex-1 bg-border"></span>
      </div>

      <ng-content />
    </div>

    <div hlmCardFooter class="justify-center text-sm text-muted-foreground">
      <ng-content select="[authShellFooter]" />
    </div>
  </div>
</main>
